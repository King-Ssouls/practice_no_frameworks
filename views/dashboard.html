<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo">Мой Не Сам</div>

            <nav class="nav">
                <a href="/register">Регистрация</a>
                <a href="/login">Вход</a>
            </nav>
        </div>
    </header>
    <main class="container">
        <h1>Мои заявки</h1>

        <a class="btn" href="/request">Создать новую заявку</a>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Услуга</th>
                        <th>Адрес</th>
                        <th>Дата и время</th>
                        <th>Оплата</th>
                        <th>Статус</th>
                        <th>Причина отмены</th>
                    </tr>
                </thead>
                <tbody>
                {{requests}}
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
